<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML</title>
</head>
<body>
     <h1>Tags em HTML</h1>
     <p>Em HTML5, podemos inserir os elementos da lista a seguir. passe o mose sobre os termos para descobrir qual tag deverá ulilizar em cada caso.</p>

     <ul>
        <li title="Use a tag &lt;p&gt;">Parágrafo</li>
        <li title="Use H1,H2,H3...H6">Títulos</li>
        <li title="Use a tag &lt;img&gt;">Imagens</li>
        <li title="Use &lt;abbr&gt;">Abreviações</li>
        <li title="Use a tag &lt;code&gt;">Códigos-fonte</li>
        <li title="Use a tag &lt;ol&gt;">Listas numeradas</li>
        <li title="Use &lt;ul> e &lt;li&gt;">Listas com demarcadores</li>
     </ul>
</body>
</html>
