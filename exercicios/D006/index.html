<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML</title>
</head>
<body>
     <h1>Tags em HTML</h1>
     <p>Em HTML5, podemos inserir os elementos da lista a seguir. passe o mose sobre os termos para descobrir qual tag deverá ulilizar em cada caso.</p>

     <ul>
        <li title="Use a tag <p>">Parágrafo</li>
        <li title="Use H1,H2,H3...H6">Títulos</li>
        <li title="Use a tag <img>">Imagens</li>
        <li title="Use <abbr>">Abreviações</li>
        <li title="Use a tag <code>">Códigos-fonte</li>
        <li title="Use a tag <ol>">Listas numeradas</li>
        <li title="Use <ul> e <li>">Listas com demarcadores</li>
     </ul>
</body>
</html>
